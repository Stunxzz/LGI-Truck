{% extends 'base.html' %}

{% block content %}

  <table class="table table-striped table-bordered text-center datagrid mt-5">
      <thead>
          <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Actions</th>
          </tr>
      </thead>
      <tbody>
          {% for user in users %}
              <tr>
                  <td data-label="FIRST NAME">{{ user.first_name }}</td>
                  <td data-label="LAST NAME">{{ user.last_name }}</td>
                  <td data-label="EMAIL">{{ user.email }}</td>
                  <td data-label="ROLE">{{ user.get_role_display }}</td>
                  <td>
                      <a href="{% url 'user_edit' user.id %}" class="btn btn-primary">
                          <i class="fas fa-edit"></i> Edit
                      </a>
                  </td>
              </tr>
          {% endfor %}
      </tbody>
  </table>
{% endblock %}
