<!DOCTYPE html>
{% load static %}


<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.4.6.min.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            max-width: 420px;
            margin: 5% auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .register-title {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h3 class="register-title">Create an Account</h3>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.help_text %}
                        <small class="form-text text-muted">{{ field.help_text }}</small>
                    {% endif %}
                    {% for error in field.errors %}
                        <div class="text-danger">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <div class="text-center mt-3">
            <p class="mb-1">Already have an account?</p>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Back to Login</a>
        </div>
    </div>

    <script src="{% static 'js/error_list.js' %}"></script>
</body>

</html>
