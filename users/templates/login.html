<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.4.6.min.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h3 class="text-center mb-4">🚚TrackLine</h3>
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <!-- Register Button -->
            <div class="text-center mt-3">
                <p class="mb-1">Don't have an account?</p>
                <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-sm">Register</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 4.6 JS -->
    <script src="{% static 'js/error_list.js' %}"></script>
</body>
</html>
