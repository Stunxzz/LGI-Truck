{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
      <div class="card p-4 shadow rounded-4">
        <h2 class="text-center mb-4">🔐 Change Password</h2>

        <form method="post">
          {% csrf_token %}

          {% for field in form %}
            <div class="form-group mb-3 text-center">
              <label for="{{ field.id_for_label }}" class="d-block mb-2">{{ field.label }}</label>
              <div class="w-100">{{ field }}</div>
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}>
          <button type="submit" class="btn btn-primary w-100 mb-3">🔒 Change Password</button>
          <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100">← Back to Profile</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
