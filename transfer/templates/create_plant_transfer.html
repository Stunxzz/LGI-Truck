{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3" style="max-width: 500px; margin: 0 auto;">
        <h4>🏭 {% if form.instance.pk %}Edit{% else %}Create{% endif %} Plant Transfer</h4>

    </div>

    <div class="card shadow-sm rounded mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group col-md-6">
                        {{ form.up.label_tag }}
                        {{ form.up }}
                        {{ form.up.errors }}
                    </div>
                    <div class="form-group col-md-6">
                        {{ form.plant.label_tag }}
                        {{ form.plant }}
                        {{ form.plant.errors }}
                    </div>
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success">
                        💾 Save
                    </button>
                    <a href="{% url 'plants_list' %}" class="btn btn-secondary ml-2">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
