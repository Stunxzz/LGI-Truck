{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🏭 Plant Transfers</h2>
        <a href="{% url 'create_plant' %}" class="btn btn-primary">+ New Transfer</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-bordered shadow-sm datagrid">
            <thead >
                <tr>

                    <th class="text-center">From (UP)</th>
                    <th class="text-center">To (Plant)</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for transfer in plant_transfers %}
                    <tr>
                        <td class="text-center" data-label='UP'>{{ transfer.up }}</td>
                        <td class="text-center" data-label='PLANT'>{{ transfer.plant }}</td>
                        <td class="text-center">
                            <a href="{% url 'update_plant' transfer.id %}" class="btn btn-sm btn-warning">✏️ Edit</a>
                            <a href="{% url 'delete_plant' plant_id=transfer.id %}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this transfer?')">🗑️ Delete</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No plant transfers found.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
