{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Packages</h2>
  <a href="{% url 'package_create' %}" class="btn btn-success mb-3">+ Add Package</a>

  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>Type</th>
        <th>LDM</th>
        <th>Max Height</th>
        <th>Max Weight</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for package in packages %}
        <tr>
          <td>{{ package.type }}</td>
          <td>{{ package.ldm }}</td>
          <td>{{ package.max_height }}</td>
          <td>{{ package.max_weight }}</td>
          <td>
            <a href="{% url 'package_edit' package.pk %}" class="btn btn-sm btn-primary">Edit</a>
            <a href="{% url 'package_delete' package.id %}" class="btn btn-sm btn-danger"
            onclick="return confirm('Are you sure you want to delete this package?')">Delete</a>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="5" class="text-center">No packages found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
