{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
  <h2 class="mb-4">📦 Packages</h2>

  <div class="d-flex justify-content-center mb-4">
    <a href="{% url 'package_create' %}" class="btn btn-success btn-lg">
      <i class="fas fa-plus-circle"></i> Add Package
    </a>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover shadow-sm rounded datagrid">
      <thead class="table-light">
        <tr class="align-middle text-center">
          <th class="text-center">Type</th>
          <th class="text-center">LDM</th>
          <th class="text-center">Max Height</th>
          <th class="text-center">Max Weight</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for package in packages %}
          <tr class="align-middle text-center">
            <td data-label="TYPE">{{ package.type }}</td>
            <td data-label="LDM">{{ package.ldm }}</td>
            <td data-label="HEIGHT">{{ package.max_height }}</td>
            <td data-label="WEIGHT">{{ package.max_weight }}</td>
            <td>
              <a href="{% url 'package_edit' package.pk %}" class="btn btn-sm btn-outline-primary me-1">
                <i class="fas fa-edit"></i> Edit
              </a>
              <a href="{% url 'package_delete' package.id %}" class="btn btn-sm btn-outline-danger"
              onclick="return confirm('Are you sure you want to delete this package?')">
                <i class="fa-solid fa-trash"></i> Delete
              </a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="5" class="text-center text-muted">No packages found.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
